name: One-time release dispatch hardening

on:
  push:
    branches:
      - windows-runtime-remediation

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows-runtime-remediation
      - name: Harden formal release dispatch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          release = Path('.github/workflows/release-desktop.yml')
          text = release.read_text(encoding='utf-8')

          trigger_old = 'on:\n  push:\n'
          trigger_new = 'on:\n  workflow_dispatch:\n  push:\n'
          if '  workflow_dispatch:\n' not in text:
              if trigger_old not in text:
                  raise SystemExit('release trigger anchor missing')
              text = text.replace(trigger_old, trigger_new, 1)

          steps_old = '  verify:\n    runs-on: ubuntu-latest\n    permissions:\n      contents: read\n    steps:\n      - uses: actions/checkout@v4\n'
          steps_new = '''  verify:\n    runs-on: ubuntu-latest\n    permissions:\n      contents: read\n    steps:\n      - name: Require a real tag ref\n        shell: bash\n        run: |\n          if [ "$GITHUB_REF_TYPE" != "tag" ]; then\n            echo "formal release requires a real tag ref" >&2\n            exit 1\n          fi\n      - uses: actions/checkout@v4\n'''
          if 'name: Require a real tag ref' not in text:
              if steps_old not in text:
                  raise SystemExit('verify steps anchor missing')
              text = text.replace(steps_old, steps_new, 1)

          release.write_text(text, encoding='utf-8')
          Path('.github/workflows/one-time-release-dispatch-hardening.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release-desktop.yml .github/workflows/one-time-release-dispatch-hardening.yml
          git diff --cached --check
          git commit -m "ci: allow tag-only formal release dispatch"
          git push origin HEAD:windows-runtime-remediation
