name: Step 12 baseline measurement

on:
  pull_request:
    branches:
      - ci/v05-step12-base
    types: [opened, synchronize, reopened]

jobs:
  macos-v0411-baseline:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download formal v0.4.11 Universal ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline/download baseline/unpacked
          gh release download v0.4.11 \
            --repo "${{ github.repository }}" \
            --pattern 'WebGPT-Bridge-0.4.11-mac-universal.zip' \
            --dir baseline/download
          ZIP="$(find baseline/download -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP"
          ditto -x -k "$ZIP" baseline/unpacked
      - name: Measure formal v0.4.11 Universal app
        run: |
          set -euo pipefail
          APP="$(find baseline/unpacked -type d -name 'WebGPT Bridge.app' -print -quit)"
          test -n "$APP"
          echo "FORMAL_V0411_UNIVERSAL_REPORT_BEGIN"
          node scripts/report-package-size.cjs "$(python3 -c 'import os,sys; print(os.path.abspath(sys.argv[1]))' "$APP")" darwin
          echo "FORMAL_V0411_UNIVERSAL_REPORT_END"

  windows-v0411-baseline:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack formal v0.4.11 Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force baseline\download, baseline\outer, baseline\unpacked | Out-Null
          gh release download v0.4.11 `
            --repo "${{ github.repository }}" `
            --pattern 'WebGPT-Bridge-0.4.11-win-x64.exe' `
            --dir baseline\download
          if ($LASTEXITCODE -ne 0) { throw "formal Windows release download failed" }
          $installer = Get-ChildItem baseline\download -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw "formal Windows installer missing" }
          & 7z x $installer.FullName "-obaseline\outer" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "installer extraction failed" }
          $payload = Get-ChildItem baseline\outer -Recurse -File -Filter 'app-*.7z' | Select-Object -First 1
          if (-not $payload) {
            Write-Host "FORMAL_V0411_WINDOWS_OUTER_LIST_BEGIN"
            Get-ChildItem baseline\outer -Recurse | ForEach-Object { $_.FullName }
            Write-Host "FORMAL_V0411_WINDOWS_OUTER_LIST_END"
            throw "electron-builder app payload archive not found"
          }
          & 7z x $payload.FullName "-obaseline\unpacked" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "app payload extraction failed" }
      - name: Measure formal v0.4.11 Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appExe = Get-ChildItem baseline\unpacked -Recurse -File -Filter 'WebGPT Bridge.exe' | Select-Object -First 1
          if (-not $appExe) {
            Write-Host "FORMAL_V0411_WINDOWS_UNPACKED_LIST_BEGIN"
            Get-ChildItem baseline\unpacked -Recurse | ForEach-Object { $_.FullName }
            Write-Host "FORMAL_V0411_WINDOWS_UNPACKED_LIST_END"
            throw "formal unpacked Windows app root not found"
          }
          $appRoot = $appExe.Directory.FullName
          Write-Host "FORMAL_V0411_WINDOWS_REPORT_BEGIN"
          node scripts/report-package-size.cjs $appRoot win32
          if ($LASTEXITCODE -ne 0) { throw "formal Windows size reporter failed" }
          Write-Host "FORMAL_V0411_WINDOWS_REPORT_END"
