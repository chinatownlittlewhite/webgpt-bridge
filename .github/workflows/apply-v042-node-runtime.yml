name: Apply v0.4.2 Windows Node runtime fix

on:
  push:
    branches:
      - fix/v042-windows-node-discovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v042-windows-node-discovery
          fetch-depth: 0
      - name: Apply exact production changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exact replacement once, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/main.cjs",
              'const { buildTrustedCommandPath, selectSupportedNode } = require("./host-path.cjs");',
              'const { buildTrustedCommandPath, preferredNodeCandidates, selectSupportedNode } = require("./host-path.cjs");',
          )

          tunnel_block = '''function defaultBundledTunnelClientPath() {\n  return bundledTunnelClientPath({\n    resourcesPath: app.isPackaged ? process.resourcesPath : path.join(__dirname, "..", "build"),\n    platform: process.platform,\n  });\n}\n'''
          replace_once(
              "src/main.cjs",
              tunnel_block,
              tunnel_block + '''\nfunction defaultBundledNodePath() {\n  if (process.platform !== "win32") return "";\n  const resourcesRoot = app.isPackaged ? process.resourcesPath : path.join(__dirname, "..", "build");\n  return path.join(resourcesRoot, "node-runtime", "node.exe");\n}\n''',
          )

          old_preferred = '''function preferredNode(settings) {\n  const candidates = [\n    settings.nodePath,\n    process.env.LPC_NODE_PATH,\n    process.platform === "darwin" ? "/opt/homebrew/bin/node" : "",\n    process.platform === "darwin" ? "/usr/local/bin/node" : "",\n    process.platform === "win32" ? path.join(process.env.ProgramFiles || "C:\\\\Program Files", "nodejs", "node.exe") : "",\n    ...nvmNodeCandidates(),\n    "node",\n  ];\n  return selectSupportedNode(candidates, nodeVersion);\n}\n'''
          new_preferred = '''function preferredNode(settings) {\n  const candidates = preferredNodeCandidates({\n    settingsNodePath: settings.nodePath,\n    lpcNodePath: process.env.LPC_NODE_PATH,\n    bundledNodePath: defaultBundledNodePath(),\n    platform: process.platform,\n    env: process.env,\n    nvmCandidates: nvmNodeCandidates(),\n  });\n  return selectSupportedNode(candidates, nodeVersion);\n}\n'''
          replace_once("src/main.cjs", old_preferred, new_preferred)

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package["scripts"]
          scripts["prepare:node-runtime:win"] = "node scripts/prepare-node-runtime.cjs windows-x64"
          scripts["dist:win"] = "npm run prepare:tunnel-client:win && npm run prepare:node-runtime:win && npm run prepare:agent && npm run verify:desktop && npm --prefix agent-runtime run acceptance && electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never"
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          replace_once(
              "build/electron-builder-options.cjs",
              '      extraResources: [{ from: "build/windows-host-prep-task.xml", to: "windows-host-prep-task.xml" }],',
              '''      extraResources: [\n        { from: "build/windows-host-prep-task.xml", to: "windows-host-prep-task.xml" },\n        { from: "build/node-runtime", to: "node-runtime" },\n      ],''',
          )

          replace_once(
              "scripts/windows-installer-smoke.ps1",
              '$resourcesRoot = Join-Path $InstallRoot "resources"',
              '$resourcesRoot = Join-Path $InstallRoot "resources"\n$bundledNode = Join-Path $resourcesRoot "node-runtime\\node.exe"',
          )
          replace_once(
              "scripts/windows-installer-smoke.ps1",
              '  if (-not (Test-Path (Join-Path $InstallRoot "WebGPT Bridge.exe") -PathType Leaf)) { throw "application was not installed at the requested custom directory: $InstallRoot" }',
              '''  if (-not (Test-Path (Join-Path $InstallRoot "WebGPT Bridge.exe") -PathType Leaf)) { throw "application was not installed at the requested custom directory: $InstallRoot" }\n  if (-not (Test-Path $bundledNode -PathType Leaf)) { throw "bundled Node runtime was not installed: $bundledNode" }\n  $bundledNodeVersion = (& $bundledNode --version | Out-String).Trim()\n  if ($LASTEXITCODE -ne 0) { throw "bundled Node runtime failed --version with exit $LASTEXITCODE" }\n  if ($bundledNodeVersion -ne "v22.23.2") { throw "bundled Node runtime has unexpected version: $bundledNodeVersion" }''',
          )
          replace_once(
              "scripts/windows-installer-smoke.ps1",
              '    protectedNativeHostBytes = Get-PathSizeBytes $installedPrep',
              '    protectedNativeHostBytes = Get-PathSizeBytes $installedPrep\n    bundledNodeBytes = Get-PathSizeBytes $bundledNode',
          )
          replace_once(
              "scripts/windows-installer-smoke.ps1",
              '  if ($repaired.status -ne "ready") { throw "post-repair host preparation is not ready: $repairedJson" }',
              '''  if ($repaired.status -ne "ready") { throw "post-repair host preparation is not ready: $repairedJson" }\n  if (-not (Test-Path $bundledNode -PathType Leaf)) { throw "bundled Node runtime was not restored by repair" }\n  $repairedNodeVersion = (& $bundledNode --version | Out-String).Trim()\n  if ($LASTEXITCODE -ne 0 -or $repairedNodeVersion -ne "v22.23.2") { throw "post-repair bundled Node runtime is not usable: $repairedNodeVersion" }''',
          )
          replace_once(
              "scripts/windows-installer-smoke.ps1",
              '  if (Test-Path $installedPrep) { throw "installed host-prep payload remained after uninstall" }',
              '  if (Test-Path $installedPrep) { throw "installed host-prep payload remained after uninstall" }\n  if (Test-Path $bundledNode) { throw "bundled Node runtime remained after uninstall" }',
          )

          manifest = {
              "project": "nodejs/node",
              "version": "22.23.2",
              "source": "https://nodejs.org/en/blog/release/v22.23.2",
              "baseUrl": "https://nodejs.org/dist/v22.23.2",
              "license": "MIT",
              "assets": {
                  "windows-x64": {
                      "file": "node-v22.23.2-win-x64.zip",
                      "sha256": "1177b4137ba5adaa56354ae40f1080c7450e8ae09cecb47da459d1c52ac99f97",
                      "nodeSha256": "0d0f5e39f9f3d9587bc19f73eab3c2c9c4903fd02d6dbf9c853dd81b3d95fad4",
                      "executable": "node.exe"
                  }
              }
          }
          Path("scripts/node-runtime-release.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")

          prepare = r'''const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");
          const { spawnSync } = require("node:child_process");
          const manifest = require("./node-runtime-release.json");

          const target = process.argv[2];
          if (target !== "windows-x64") throw new Error(`Unsupported Node runtime target: ${target || "(missing)"}`);
          if (process.platform !== "win32" || process.arch !== "x64") {
            throw new Error(`Target ${target} must be prepared on win32/x64, current host is ${process.platform}/${process.arch}`);
          }

          const asset = manifest.assets[target];
          if (!asset?.file || !asset?.executable || !/^[a-f0-9]{64}$/.test(String(asset.sha256 || "")) || !/^[a-f0-9]{64}$/.test(String(asset.nodeSha256 || ""))) {
            throw new Error(`Incomplete Node runtime asset metadata for ${target}`);
          }

          const root = path.resolve(__dirname, "..");
          const work = path.join(root, "build", ".node-runtime-download");
          const output = path.join(root, "build", "node-runtime");
          const archive = path.join(work, asset.file);
          const extracted = path.join(work, "extracted");

          function sha256(file) {
            return crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
          }

          function run(command, args, { capture = false } = {}) {
            const result = spawnSync(command, args, capture
              ? { encoding: "utf8", shell: false, windowsHide: true }
              : { stdio: "inherit", shell: false, windowsHide: true });
            if (result.error) throw result.error;
            if (result.status !== 0) throw new Error(`${command} exited with ${result.status}`);
            return capture ? String(result.stdout || "") : "";
          }

          function findFile(dir, name) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                const nested = findFile(full, name);
                if (nested) return nested;
              } else if (entry.isFile() && entry.name.toLowerCase() === name.toLowerCase()) {
                return full;
              }
            }
            return "";
          }

          async function main() {
            fs.rmSync(work, { recursive: true, force: true });
            fs.rmSync(output, { recursive: true, force: true });
            fs.mkdirSync(work, { recursive: true });
            const url = `${manifest.baseUrl}/${asset.file}`;
            const response = await fetch(url, { redirect: "follow" });
            if (!response.ok) throw new Error(`Download failed (${response.status}) for ${url}`);
            fs.writeFileSync(archive, Buffer.from(await response.arrayBuffer()));

            const archiveDigest = sha256(archive);
            if (archiveDigest !== asset.sha256) {
              throw new Error(`SHA-256 mismatch for ${asset.file}: expected ${asset.sha256}, got ${archiveDigest}`);
            }

            fs.mkdirSync(extracted, { recursive: true });
            run("tar.exe", ["-xf", archive, "-C", extracted]);
            const nodeExe = findFile(extracted, asset.executable);
            if (!nodeExe) throw new Error(`Archive does not contain ${asset.executable}: ${asset.file}`);
            const nodeDigest = sha256(nodeExe);
            if (nodeDigest !== asset.nodeSha256) {
              throw new Error(`SHA-256 mismatch for ${asset.executable}: expected ${asset.nodeSha256}, got ${nodeDigest}`);
            }

            const version = run(nodeExe, ["--version"], { capture: true }).trim();
            if (version !== `v${manifest.version}`) throw new Error(`Bundled Node version mismatch: expected v${manifest.version}, got ${version}`);
            const license = findFile(extracted, "LICENSE");
            if (!license) throw new Error("Node release archive does not contain LICENSE");

            fs.mkdirSync(output, { recursive: true });
            fs.copyFileSync(nodeExe, path.join(output, "node.exe"));
            fs.copyFileSync(license, path.join(output, "LICENSE"));
            fs.writeFileSync(path.join(output, "BUNDLED_SOURCE.json"), `${JSON.stringify({
              project: manifest.project,
              version: manifest.version,
              source: manifest.source,
              target,
              file: asset.file,
              sha256: asset.sha256,
              nodeSha256: asset.nodeSha256,
              license: manifest.license,
            }, null, 2)}\n`);
            console.log(`Prepared Node.js v${manifest.version} for ${target}`);
          }

          main().finally(() => {
            fs.rmSync(work, { recursive: true, force: true });
          }).catch((error) => {
            fs.rmSync(output, { recursive: true, force: true });
            console.error(error.stack || error.message);
            process.exit(1);
          });
          '''
          prepare = "\n".join(line[10:] if line.startswith("          ") else line for line in prepare.splitlines()) + "\n"
          Path("scripts/prepare-node-runtime.cjs").write_text(prepare, encoding="utf-8")
          PY

          rm .github/workflows/apply-v042-node-runtime.yml
          node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8')); JSON.parse(require('node:fs').readFileSync('scripts/node-runtime-release.json','utf8'));"
          git diff --check
      - name: Commit isolated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bundle supported Node runtime on Windows"
          git push origin HEAD:fix/v042-windows-node-discovery
