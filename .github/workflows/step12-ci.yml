name: Step 12 validation

on:
  pull_request:
    branches:
      - ci/v05-step12-base
    types: [opened, synchronize, reopened]

jobs:
  desktop-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:desktop

  macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - name: Validate staged macOS variants
        shell: bash
        run: |
          set -euo pipefail
          ARM64_COUNT=0
          X64_COUNT=0
          UNIVERSAL_COUNT=0
          APP_COUNT=0
          UNIVERSAL_APP=""

          assert_exact_arches() {
            local file="$1"
            local variant="$2"
            [ -f "$file" ] || { echo "required macOS binary missing: $file" >&2; exit 1; }
            local arches
            arches="$(/usr/bin/lipo -archs "$file")"
            case "$variant:$arches" in
              "arm64:arm64"|"x64:x86_64"|"universal:arm64 x86_64"|"universal:x86_64 arm64") ;;
              *) echo "unexpected architectures for $variant binary $file: $arches" >&2; exit 1 ;;
            esac
          }

          while IFS= read -r -d '' APP; do
            APP_COUNT=$((APP_COUNT + 1))
            APP_BIN="$APP/Contents/MacOS/WebGPT Bridge"
            ARCHES="$(/usr/bin/lipo -archs "$APP_BIN")"
            case "$ARCHES" in
              "arm64") VARIANT="arm64"; ARM64_COUNT=$((ARM64_COUNT + 1)) ;;
              "x86_64") VARIANT="x64"; X64_COUNT=$((X64_COUNT + 1)) ;;
              "arm64 x86_64"|"x86_64 arm64") VARIANT="universal"; UNIVERSAL_COUNT=$((UNIVERSAL_COUNT + 1)); UNIVERSAL_APP="$APP" ;;
              *) echo "unrecognized packaged app architectures: $ARCHES ($APP)" >&2; exit 1 ;;
            esac
            npm run verify:mac-native-artifact -- "$APP" "$VARIANT"
            assert_exact_arches "$APP_BIN" "$VARIANT"
            assert_exact_arches "$APP/Contents/Resources/tunnel-client/tunnel-client" "$VARIANT"
            assert_exact_arches "$APP/Contents/Resources/tunnel-client/cloudflared" "$VARIANT"
          done < <(find release -type d -name 'WebGPT Bridge.app' -print0)

          if [ "$APP_COUNT" != "3" ] || [ "$ARM64_COUNT" != "1" ] || [ "$X64_COUNT" != "1" ] || [ "$UNIVERSAL_COUNT" != "1" ]; then
            echo "expected exactly one staged app for arm64, x64 and universal; total=$APP_COUNT arm64=$ARM64_COUNT x64=$X64_COUNT universal=$UNIVERSAL_COUNT" >&2
            exit 1
          fi
          APP="$UNIVERSAL_APP"
          npm run verify:mac-packaged-pty -- "$APP"

          for VARIANT in arm64 x64 universal; do
            for EXT in dmg zip; do
              COUNT="$(find release -maxdepth 1 -type f -name "WebGPT-Bridge-*-mac-${VARIANT}.${EXT}" -print | wc -l | tr -d '[:space:]')"
              if [ "$COUNT" != "1" ]; then
                echo "expected exactly one $VARIANT $EXT artifact; found $COUNT" >&2
                exit 1
              fi
            done
          done
