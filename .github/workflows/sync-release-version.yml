name: Sync release version metadata

on:
  push:
    branches:
      - feature/windows-system-ssh

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize lockfile version and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) {
            throw new Error(`lockfile version mismatch: package=${pkg.version} lock=${lock.version} root=${lock.packages?.['']?.version}`);
          }
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-release-version.yml
          git add package-lock.json
          git diff --cached --check
          git commit -m 'chore: sync 0.5.1 release metadata'
          git push origin HEAD:feature/windows-system-ssh
