name: Prepare v0.3.7 version metadata

on:
  push:
    branches:
      - release-v0.3.7
    paths:
      - .github/workflows/prepare-v0.3.7.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v0.3.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump package metadata exactly once
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/workflows/prepare-v0.3.7.yml ]; then
            echo "bootstrap workflow already removed; nothing to do"
            exit 0
          fi
          current="$(node -p 'require("./package.json").version')"
          if [ "$current" = "0.3.7" ]; then
            echo "version already prepared"
            exit 0
          fi
          if [ "$current" != "0.3.6" ]; then
            echo "unexpected current version: $current" >&2
            exit 1
          fi
          npm version 0.3.7 --no-git-tag-version --ignore-scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --check
          git commit -m "chore: bump version to 0.3.7"
          git push origin HEAD:release-v0.3.7
