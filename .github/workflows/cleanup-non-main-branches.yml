name: One-time branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-non-main-branches.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'chinatownlittlewhite/webgpt-bridge'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --heads origin \
            | awk '{print $2}' \
            | sed 's#^refs/heads/##' \
            | while IFS= read -r branch; do
                if [[ -n "$branch" && "$branch" != "main" ]]; then
                  echo "Deleting branch: $branch"
                  git push origin --delete "$branch"
                fi
              done

      - name: Verify only main remains
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin \
              | awk '{print $2}' \
              | sed 's#^refs/heads/##' \
              | sort
          )
          printf 'Remaining branches:\n'
          printf '  %s\n' "${branches[@]}"
          if [[ ${#branches[@]} -ne 1 || "${branches[0]}" != "main" ]]; then
            echo "Expected exactly one branch named main" >&2
            exit 1
          fi
