name: v0.5 final validation

on:
  push:
    branches:
      - task/v05-ui-diagnostics-final-acceptance

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      - run: npm --prefix agent-runtime ci
      - name: Run all Desktop tests
        run: npm run verify:desktop
      - name: Run Agent quick acceptance
        run: npm --prefix agent-runtime run acceptance:quick
