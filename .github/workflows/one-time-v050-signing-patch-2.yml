name: One-time v0.5.0 signing patch retry

on:
  push:
    branches:
      - "fix/v050-macos-signing"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact release signing patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          dollar = "$"
          expr = lambda name: dollar + "{{ secrets." + name + " }}"
          shvar = lambda name: dollar + "{" + name + ":-}"
          sharrlen = dollar + "{#missing[@]}"
          sharr = dollar + "{missing[@]}"

          release_old = '''  macos:\n    needs: [verify, draft]\n    runs-on: macos-latest\n    permissions:\n      contents: read\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n      - run: npm ci\n      - run: npm run dist:mac\n'''
          release_new = f'''  macos:\n    needs: [verify, draft]\n    runs-on: macos-latest\n    permissions:\n      contents: read\n    env:\n      WEBGPT_FORMAL_RELEASE: macos\n      CSC_LINK: {expr("MACOS_CSC_LINK")}\n      CSC_KEY_PASSWORD: {expr("MACOS_CSC_KEY_PASSWORD")}\n      WEBGPT_MAC_IDENTITY: {expr("MACOS_SIGNING_IDENTITY")}\n      APPLE_ID: {expr("APPLE_ID")}\n      APPLE_APP_SPECIFIC_PASSWORD: {expr("APPLE_APP_SPECIFIC_PASSWORD")}\n      APPLE_TEAM_ID: {expr("APPLE_TEAM_ID")}\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n      - run: npm ci\n      - name: Validate macOS release signing credentials\n        shell: bash\n        run: |\n          set -euo pipefail\n          missing=()\n          [ -n "{shvar("CSC_LINK")}" ] || missing+=("MACOS_CSC_LINK")\n          [ -n "{shvar("CSC_KEY_PASSWORD")}" ] || missing+=("MACOS_CSC_KEY_PASSWORD")\n          [ -n "{shvar("WEBGPT_MAC_IDENTITY")}" ] || missing+=("MACOS_SIGNING_IDENTITY")\n          [ -n "{shvar("APPLE_ID")}" ] || missing+=("APPLE_ID")\n          [ -n "{shvar("APPLE_APP_SPECIFIC_PASSWORD")}" ] || missing+=("APPLE_APP_SPECIFIC_PASSWORD")\n          [ -n "{shvar("APPLE_TEAM_ID")}" ] || missing+=("APPLE_TEAM_ID")\n          if [ "{sharrlen}" -ne 0 ]; then\n            printf 'missing macOS release secret: %s\\n' "{sharr}" >&2\n            exit 1\n          fi\n      - run: npm run dist:mac\n'''
          replace_once('.github/workflows/release-desktop.yml', release_old, release_new)

          verify_old = '''            assert_exact_arches "$APP_BIN" "$VARIANT"\n            assert_exact_arches "$APP/Contents/Resources/tunnel-client/tunnel-client" "$VARIANT"\n            assert_exact_arches "$APP/Contents/Resources/tunnel-client/cloudflared" "$VARIANT"\n'''
          verify_new = '''            assert_exact_arches "$APP_BIN" "$VARIANT"\n            assert_exact_arches "$APP/Contents/Resources/tunnel-client/tunnel-client" "$VARIANT"\n            assert_exact_arches "$APP/Contents/Resources/tunnel-client/cloudflared" "$VARIANT"\n            codesign --verify --deep --strict --verbose=2 "$APP"\n            xcrun stapler validate "$APP"\n            spctl --assess --type execute --verbose=4 "$APP"\n'''
          replace_once('.github/workflows/release-desktop.yml', verify_old, verify_new)

          policy_test_old = '''test("current release policy documents unsigned GitHub distribution and controlled prerelease replacement", () => {\n  const docs = fs.readFileSync(path.join(__dirname, "..", "docs", "release-signing.md"), "utf8");\n  assert.match(docs, /without requiring external code-signing or Apple notarization credentials/);\n  assert.match(docs, /published prerelease may be deleted and rebuilt under the same version/);\n  assert.match(docs, /Never overwrite a stable public release/);\n  assert.doesNotMatch(docs, /AZURE_CLIENT_SECRET/);\n});\n'''
          policy_test_new = '''test("current release policy requires signed notarized macOS distribution and controlled stable repair", () => {\n  const docs = fs.readFileSync(path.join(__dirname, "..", "docs", "release-signing.md"), "utf8");\n  assert.match(docs, /Developer ID/);\n  assert.match(docs, /notarization/);\n  assert.match(docs, /Gatekeeper/);\n  assert.match(docs, /same-version repair/);\n  assert.doesNotMatch(docs, /AZURE_CLIENT_SECRET/);\n});\n'''
          replace_once('test/package-content.test.cjs', policy_test_old, policy_test_new)

          replace_once('test/release-workflow.test.cjs', 'assert.match(mac, /spctl\\s+--assess[^\\n]*--type\\s+open/);', 'assert.match(mac, /spctl\\s+--assess[^\\n]*--type\\s+(?:exec|execute)/);')

          readme_old = '''在 [Releases](https://github.com/chinatownlittlewhite/webgpt-bridge/releases) 下载对应系统的最新正式发行包。正式版本采用同一个 GitHub Release 同时发布 Windows x64 与 macOS Universal（Apple Silicon + Intel）资产，并附带 `SHA256SUMS` 供下载后核验。\n\n| 平台 | 推荐下载 |\n| --- | --- |\n| macOS Apple Silicon / Intel | `WebGPT Bridge-<version>-mac-universal.dmg`；当前公开 GitHub Release 为 Universal 构建，但不要求 Developer ID 签名或 Apple notarization 凭据 |\n| Windows 10 / 11 x64 | `WebGPT Bridge-<version>-win-x64.exe`；当前公开 GitHub Release 不要求外部代码签名凭据 |\n\n当前 GitHub 发行模式是**未签名/未强制 notarization**的直接分发，具体策略以 `docs/release-signing.md` 为准。因此 Windows 可能显示 SmartScreen 警告，macOS 可能显示 Gatekeeper 来源/公证警告；请从本仓库 Release 下载并核对 `SHA256SUMS`。仓库仍保留可选的正式签名/公证 builder 配置，但只有在明确启用并提供外部身份凭据时才生效，notarization 不是当前公开 Release 的发布门槛。\n'''
          readme_new = '''在 [Releases](https://github.com/chinatownlittlewhite/webgpt-bridge/releases) 下载对应系统的最新正式发行包。正式版本在同一个 GitHub Release 发布 Windows x64，以及 macOS arm64、x64 和 Universal 资产，并附带 `SHA256SUMS` 供下载后核验。完整安装与代理排障说明见 [`INSTALLATION.md`](INSTALLATION.md)。\n\n| 平台 | 推荐下载 |\n| --- | --- |\n| macOS Apple Silicon | `WebGPT-Bridge-<version>-mac-arm64.dmg`；macOS 正式包使用 Developer ID 签名并完成 Apple notarization |\n| macOS Intel | `WebGPT-Bridge-<version>-mac-x64.dmg`；macOS 正式包使用 Developer ID 签名并完成 Apple notarization |\n| macOS 通用包 | `WebGPT-Bridge-<version>-mac-universal.dmg`；同时包含 Apple Silicon 与 Intel |\n| Windows 10 / 11 x64 | `WebGPT-Bridge-<version>-win-x64.exe`；当前公开 GitHub Release 不要求外部代码签名凭据 |\n\nmacOS 正式发布把 Developer ID 签名、Apple notarization、stapling 和 Gatekeeper 验证作为强制门槛；任何一步失败都不会上传对应产物。Windows 当前仍可能显示 SmartScreen 信誉警告。无论平台都请从本仓库 Release 下载并核对 `SHA256SUMS`。\n'''
          replace_once('README.md', readme_old, readme_new)
          replace_once('README.md', '发现新版本后，应用会显示版本与发行说明，并提供打开该版本 GitHub Release 的操作。当前未签名发行模式不会在应用内自动下载或安装更新；用户从固定的公开 GitHub Release 手动下载安装包，检查失败或用户暂不升级时当前已安装版本继续可用。', '发现新版本后，应用会显示版本与发行说明，并提供打开该版本 GitHub Release 的操作。应用仍不会自动下载或安装更新；用户从固定的公开 GitHub Release 手动下载安装包，检查失败或用户暂不升级时当前已安装版本继续可用。')
          replace_once('README.md', '3. 首次打开如被 Gatekeeper 拦截：在 Finder 中按住 Control 点击应用，选择“打开”，再确认“打开”。', '3. 正式 macOS 包应直接通过 Gatekeeper。若仍出现“应用已损坏”或无法验证提示，请先核对 `SHA256SUMS`；校验一致仍失败时请提交 Issue，不要全局关闭 Gatekeeper。')

          replace_once('INSTALLATION.md', '- macOS Apple Silicon / Intel：`WebGPT-Bridge-<version>-mac-universal.dmg`\n- Windows 10 / 11 x64：`WebGPT-Bridge-<version>-win-x64.exe`\n', '- macOS Apple Silicon：`WebGPT-Bridge-<version>-mac-arm64.dmg`\n- macOS Intel：`WebGPT-Bridge-<version>-mac-x64.dmg`\n- macOS Universal（可选）：`WebGPT-Bridge-<version>-mac-universal.dmg`\n- Windows 10 / 11 x64：`WebGPT-Bridge-<version>-win-x64.exe`\n')
          replace_once('INSTALLATION.md', 'shasum -a 256 "WebGPT-Bridge-<version>-mac-universal.dmg"', 'shasum -a 256 "WebGPT-Bridge-<version>-mac-arm64.dmg"')
          replace_once('INSTALLATION.md', '1. 下载 `WebGPT-Bridge-<version>-mac-universal.dmg`。', '1. Apple Silicon 下载 `WebGPT-Bridge-<version>-mac-arm64.dmg`；Intel 下载 `WebGPT-Bridge-<version>-mac-x64.dmg`。')
          install_old = '''### macOS 提示无法验证开发者或阻止打开\n\n当前公开 Release 采用未强制 Developer ID 签名/notarization 的直接分发模式，所以 Gatekeeper 可能提示来源或公证警告。\n\n先确认安装包来自本仓库正式 Release，并核对 SHA-256。确认无误后，在 Finder 的“应用程序”中按住 Control 点击 `WebGPT Bridge.app`，选择“打开”，再在系统提示中确认“打开”。\n\n不要为了安装本应用永久关闭 Gatekeeper，也不建议关闭系统整体安全保护。\n'''
          install_new = '''### macOS 提示“应用已损坏”、无法验证开发者或阻止打开\n\n正式 macOS Release 必须通过 Developer ID 签名、Apple notarization、stapling 与 Gatekeeper 验证后才能发布，因此这类提示不再属于预期安装流程。\n\n先确认安装包来自本仓库正式 Release，并核对 SHA-256。如果校验不一致，请重新下载；如果校验一致但 Gatekeeper 仍拒绝打开，请记录 macOS 版本、芯片架构、安装包文件名和 `spctl` 提示并提交 Issue。不要通过 `xattr` 清除隔离属性来掩盖正式发行问题，也不要全局关闭 Gatekeeper。\n'''
          replace_once('INSTALLATION.md', install_old, install_new)

          docs = Path('docs/release-signing.md')
          docs.write_text(docs.read_text().replace('Every DMG must also pass Gatekeeper assessment with `spctl --assess --type open --context context:primary-signature -v`. Failure of signing, notarization, stapling, architecture checks, native-module checks, or Gatekeeper assessment blocks publication.', 'Every staged `.app` must also pass Gatekeeper assessment with `spctl --assess --type execute --verbose=4`. Failure of signing, notarization, stapling, architecture checks, native-module checks, or Gatekeeper assessment blocks publication.'))

          plan = Path('docs/superpowers/plans/2026-09-01-v050-macos-signing-repair.md')
          plan.write_text(plan.read_text().replace('- Every DMG must pass `xcrun stapler validate` and `spctl --assess --type open --context context:primary-signature -v`.', '- Every staged `.app` must pass `xcrun stapler validate` and `spctl --assess --type execute --verbose=4`.'))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release-desktop.yml README.md INSTALLATION.md docs/release-signing.md docs/superpowers/plans/2026-09-01-v050-macos-signing-repair.md test/package-content.test.cjs test/release-workflow.test.cjs
          git diff --cached --check
          git commit -m "fix: require signed notarized macOS releases"
          git push origin HEAD:"fix/v050-macos-signing"
