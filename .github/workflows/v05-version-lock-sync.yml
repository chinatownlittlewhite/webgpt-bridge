name: Sync v0.5.0 lock metadata

on:
  push:
    branches:
      - continue/handoff-20260828-latest

permissions:
  contents: write

jobs:
  sync-version-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: continue/handoff-20260828-latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate aligned npm release metadata
        run: |
          set -euo pipefail
          npm version 0.5.0 --no-git-tag-version --allow-same-version
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          if (pkg.version !== '0.5.0' || lock.version !== '0.5.0' || lock.packages[''].version !== '0.5.0') {
            throw new Error('v0.5.0 package/lock metadata did not align');
          }
          NODE
      - name: Commit generated lock metadata and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git rm .github/workflows/v05-version-lock-sync.yml
          git diff --cached --check
          git commit -m 'chore: sync v0.5.0 release metadata'
          git push origin HEAD:refs/heads/continue/handoff-20260828-latest
