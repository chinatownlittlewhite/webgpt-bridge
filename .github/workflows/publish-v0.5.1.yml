name: Publish v0.5.1 release bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0.5.1.yml

permissions:
  contents: write
  actions: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v0.5.1
      RELEASE_SHA: aa7aa867f54293aada52ef7d17e62b1e5d62c524
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create exact release tag and dispatch formal release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          RESOLVED_SHA="$(git rev-parse "${RELEASE_SHA}^{commit}")"
          test "$RESOLVED_SHA" = "$RELEASE_SHA"
          VERSION="$(git show "$RELEASE_SHA:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          test "$VERSION" = "0.5.1"
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            EXISTING="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$EXISTING" = "$RELEASE_SHA"
          else
            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          gh workflow run release-desktop.yml --ref "$RELEASE_TAG"
      - name: Remove one-shot bootstrap from main
        shell: bash
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/publish-v0.5.1.yml
          git commit -m 'chore: remove v0.5.1 release bootstrap [skip ci]'
          git push origin HEAD:main
