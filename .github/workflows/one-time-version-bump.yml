name: One-time version bump

on:
  push:
    branches:
      - windows-runtime-remediation

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: windows-runtime-remediation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump package and lockfile to 0.3.5
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.3.5 --no-git-tag-version
          rm .github/workflows/one-time-version-bump.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/one-time-version-bump.yml
          git diff --cached --check
          git commit -m "release: bump version to 0.3.5"
          git push origin HEAD:windows-runtime-remediation
