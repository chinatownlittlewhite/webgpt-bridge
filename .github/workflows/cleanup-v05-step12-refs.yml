name: Cleanup v0.5 Step 12 temporary refs

on:
  push:
    branches:
      - continue/handoff-20260828-latest

permissions:
  contents: write

jobs:
  delete-temporary-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for ref in \
            'heads/task/v05-macos-variants-size-budget' \
            'heads/ci/v05-step12-base' \
            'heads/__probe-do-not-use' \
            'heads/cleanup/v05-step12-refs'
          do
            echo "Deleting $ref"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${ref}"
          done
