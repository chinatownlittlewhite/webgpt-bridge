name: Release desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a real tag ref
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "formal release requires a real tag ref" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix agent-runtime ci --ignore-scripts
      - run: npm run release:verify-tag
      - run: npm run verify:desktop
      - run: npm --prefix agent-runtime test
      - run: npm --prefix agent-runtime run lint
      - run: npm --prefix agent-runtime run contract

  draft:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or reuse only an unpublished exact draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > /tmp/release.json 2>/dev/null; then
            node -e 'const fs=require("node:fs"); const v=JSON.parse(fs.readFileSync("/tmp/release.json","utf8")); if(v.isDraft!==true) process.exit(1)'
            echo "Reusing existing unpublished draft $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME"
          fi

  windows:
    needs: [verify, draft]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - run: npm --prefix agent-runtime ci
      - name: Build Windows native helpers
        run: npm --prefix agent-runtime run build:native
      - name: Prepare Windows AppContainer host access
        shell: pwsh
        run: |
          $prep = (Resolve-Path "agent-runtime\native\windows-host\bin\release\lpc-windows-host.exe").Path
          & $prep host-prep --apply
          if ($LASTEXITCODE -ne 0) { throw "host-prep first apply failed with exit $LASTEXITCODE" }
          & $prep host-prep --apply
          if ($LASTEXITCODE -ne 0) { throw "host-prep second apply failed with exit $LASTEXITCODE" }
          $readyJson = & $prep host-prep --check --json
          if ($LASTEXITCODE -ne 0) { throw "host-prep check failed with exit $LASTEXITCODE" }
          if (($readyJson | ConvertFrom-Json).status -ne "ready") { throw "host-prep did not become ready: $readyJson" }
          & $prep host-prep --remove
          if ($LASTEXITCODE -ne 0) { throw "host-prep remove failed with exit $LASTEXITCODE" }
          $removedJson = & $prep host-prep --check --json
          if ($LASTEXITCODE -ne 0) { throw "host-prep post-remove check failed with exit $LASTEXITCODE" }
          if (($removedJson | ConvertFrom-Json).status -ne "capability_ace_missing") { throw "host-prep remained unexpectedly ready after remove: $removedJson" }
          & $prep host-prep --apply
          if ($LASTEXITCODE -ne 0) { throw "host-prep repair apply failed with exit $LASTEXITCODE" }
          $repairedJson = & $prep host-prep --check --json
          if ($LASTEXITCODE -ne 0) { throw "host-prep repair check failed with exit $LASTEXITCODE" }
          if (($repairedJson | ConvertFrom-Json).status -ne "ready") { throw "host-prep repair did not return to ready: $repairedJson" }
      - name: Run Windows acceptance as standard user
        shell: pwsh
        run: |
          $username = "wgbrel$PID"
          $passwordPlain = "WgB!$([guid]::NewGuid().ToString('N'))9a"
          $securePassword = ConvertTo-SecureString $passwordPlain -AsPlainText -Force
          New-LocalUser -Name $username -Password $securePassword -AccountNeverExpires -PasswordNeverExpires | Out-Null
          $qualified = "$env:COMPUTERNAME\$username"
          $acceptanceTemp = Join-Path $env:GITHUB_WORKSPACE ".ci-windows-standard-user-temp"
          $previousTemp = $env:TEMP
          $previousTmp = $env:TMP
          try {
            $adminMembers = Get-LocalGroupMember -Group "Administrators"
            if ($adminMembers.Name -contains $qualified) { throw "acceptance user unexpectedly belongs to Administrators" }
            & "$env:SystemRoot\System32\icacls.exe" $env:GITHUB_WORKSPACE /grant "${qualified}:(OI)(CI)F" /Q | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "failed to grant the standard user workspace access" }
            New-Item -ItemType Directory -Path $acceptanceTemp -Force | Out-Null
            $env:TEMP = $acceptanceTemp
            $env:TMP = $acceptanceTemp
            $npm = (Get-Command npm.cmd).Source
            $stdout = Join-Path $env:RUNNER_TEMP "webgpt-release-standard-user.stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "webgpt-release-standard-user.stderr.log"
            $credential = [System.Management.Automation.PSCredential]::new($qualified, $securePassword)
            $process = Start-Process -FilePath $npm `
              -ArgumentList @("--prefix", "agent-runtime", "run", "acceptance", "--", "--prebuilt-native") `
              -WorkingDirectory $env:GITHUB_WORKSPACE `
              -Credential $credential `
              -LoadUserProfile `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -Wait -PassThru
            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            if ($process.ExitCode -ne 0) { throw "standard-user Windows acceptance failed with exit $($process.ExitCode)" }
          }
          finally {
            $env:TEMP = $previousTemp
            $env:TMP = $previousTmp
            Remove-Item -LiteralPath $acceptanceTemp -Recurse -Force -ErrorAction SilentlyContinue
            Remove-LocalUser -Name $username -ErrorAction SilentlyContinue
          }
      - run: npm run dist:win
      - name: Smoke install Windows NSIS artifact
        shell: pwsh
        run: |
          $prep = (Resolve-Path "agent-runtime\native\windows-host\bin\release\lpc-windows-host.exe").Path
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File "scripts\windows-installer-smoke.ps1" `
            -ArtifactsDir "release" `
            -SourcePrep $prep
          if ($LASTEXITCODE -ne 0) { throw "Windows installer lifecycle smoke failed with exit $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-windows
          path: |
            release/WebGPT-Bridge-*-win-x64.exe
            release/WebGPT-Bridge-*-win-x64.exe.blockmap
            release/latest.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-windows-size
          path: release/windows-install-size.json
          if-no-files-found: error
      - name: Cleanup Windows host preparation
        if: always()
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:SystemDrive "WebGPT-Bridge-Custom-Install-Smoke"
          if (Test-Path $installRoot) {
            $uninstaller = Get-ChildItem -Path $InstallRoot -Filter "Uninstall*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($uninstaller) {
              $cleanup = Start-Process -FilePath $uninstaller.FullName -ArgumentList @("/S") -Wait -PassThru
              if ($cleanup.ExitCode -ne 0) { Write-Warning "release cleanup uninstall returned exit $($cleanup.ExitCode)" }
            }
          }
          & "$env:SystemRoot\System32\schtasks.exe" /Delete /TN "WebGPT Bridge Host Preparation" /F *> $null
          $prep = "agent-runtime\native\windows-host\bin\release\lpc-windows-host.exe"
          if (Test-Path $prep) {
            & $prep host-prep --remove
            if ($LASTEXITCODE -ne 0) { Write-Warning "host-prep cleanup returned exit $LASTEXITCODE" }
          }
          Remove-Item -LiteralPath (Join-Path $env:ProgramFiles "WebGPT Bridge Host") -Recurse -Force -ErrorAction SilentlyContinue

  macos:
    needs: [verify, draft]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - name: Verify Universal macOS artifacts
        shell: bash
        run: |
          set -euo pipefail
          APP_COUNT="$(find release -type d -name 'WebGPT Bridge.app' -print | wc -l | tr -d '[:space:]')"
          if [ "$APP_COUNT" != "1" ]; then
            echo "packaged app must resolve exactly once; found $APP_COUNT" >&2
            exit 1
          fi
          APP="$(find release -type d -name 'WebGPT Bridge.app' -print -quit)"
          APP="$(pwd -P)/$APP"
          npm run verify:mac-native-artifact -- "$APP"
          npm run verify:mac-packaged-pty -- "$APP"
          node scripts/report-package-size.cjs "$APP" > release/macos-package-size.json
          cat release/macos-package-size.json
          APP_BIN="$APP/Contents/MacOS/WebGPT Bridge"
          TUNNEL_BIN="$APP/Contents/Resources/tunnel-client/tunnel-client"
          CLOUDFLARED_BIN="$APP/Contents/Resources/tunnel-client/cloudflared"

          check_arches() {
            local file="$1"
            [ -f "$file" ] || { echo "required Universal binary missing: $file" >&2; exit 1; }
            local arches
            arches="$(/usr/bin/lipo -archs "$file")"
            printf '%s\n' "$arches" | grep -qw arm64
            printf '%s\n' "$arches" | grep -qw x86_64
          }
          check_arches "$APP_BIN"
          check_arches "$TUNNEL_BIN"
          check_arches "$CLOUDFLARED_BIN"

          DMG_COUNT="$(find release -maxdepth 1 -type f -name 'WebGPT-Bridge-*-mac-universal.dmg' -print | wc -l | tr -d '[:space:]')"
          ZIP_COUNT="$(find release -maxdepth 1 -type f -name 'WebGPT-Bridge-*-mac-universal.zip' -print | wc -l | tr -d '[:space:]')"
          if [ "$DMG_COUNT" != "1" ] || [ "$ZIP_COUNT" != "1" ]; then
            echo "macOS release must contain exactly one Universal DMG and ZIP" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-macos
          path: |
            release/WebGPT-Bridge-*-mac-universal.dmg
            release/WebGPT-Bridge-*-mac-universal.dmg.blockmap
            release/WebGPT-Bridge-*-mac-universal.zip
            release/WebGPT-Bridge-*-mac-universal.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-macos-size
          path: release/macos-package-size.json
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-windows
          path: release-win
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-macos
          path: release-mac
      - run: node scripts/validate-release-assets.cjs --version "${GITHUB_REF_NAME#v}" --windows release-win --mac release-mac
      - run: node scripts/write-release-checksums.cjs release-win release-mac --out SHA256SUMS
      - name: Upload exact validated assets to draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' ASSETS < <(find release-win release-mac -maxdepth 1 -type f -print0)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "no validated release assets found" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" SHA256SUMS
      - name: Publish stable release atomically after all gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
