name: Release desktop apps

on:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix agent-runtime ci --ignore-scripts
      - run: npm run release:verify-tag
      - run: npm run verify:desktop
      - run: npm --prefix agent-runtime test
      - run: npm --prefix agent-runtime run lint
      - run: npm --prefix agent-runtime run contract

  draft:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create or reuse only an unpublished exact draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > /tmp/release.json 2>/dev/null; then
            node -e 'const fs=require("node:fs"); const v=JSON.parse(fs.readFileSync("/tmp/release.json","utf8")); if(v.isDraft!==true) process.exit(1)'
            echo "Reusing existing unpublished draft $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME"
          fi

  windows:
    needs: [verify, draft]
    runs-on: windows-latest
    environment: desktop-release-windows
    permissions:
      contents: read
      id-token: write
    env:
      WEBGPT_FORMAL_RELEASE: "windows"
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      WEBGPT_WINDOWS_SIGN_ENDPOINT: ${{ vars.WEBGPT_WINDOWS_SIGN_ENDPOINT }}
      WEBGPT_WINDOWS_SIGN_ACCOUNT: ${{ vars.WEBGPT_WINDOWS_SIGN_ACCOUNT }}
      WEBGPT_WINDOWS_SIGN_PROFILE: ${{ vars.WEBGPT_WINDOWS_SIGN_PROFILE }}
      WEBGPT_WINDOWS_PUBLISHER: ${{ vars.WEBGPT_WINDOWS_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - run: npm --prefix agent-runtime ci
      - name: Create Azure workload identity token file
        shell: pwsh
        run: |
          foreach ($name in @(
            "AZURE_TENANT_ID",
            "AZURE_CLIENT_ID",
            "WEBGPT_WINDOWS_SIGN_ENDPOINT",
            "WEBGPT_WINDOWS_SIGN_ACCOUNT",
            "WEBGPT_WINDOWS_SIGN_PROFILE",
            "WEBGPT_WINDOWS_PUBLISHER"
          )) {
            if (-not (Get-Item "Env:$name" -ErrorAction SilentlyContinue).Value) {
              throw "missing protected Windows release configuration: $name"
            }
          }
          $audience = [uri]::EscapeDataString("api://AzureADTokenExchange")
          $separator = if ($env:ACTIONS_ID_TOKEN_REQUEST_URL.Contains("?")) { "&" } else { "?" }
          $uri = "$env:ACTIONS_ID_TOKEN_REQUEST_URL${separator}audience=$audience"
          $response = Invoke-RestMethod -Uri $uri -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
          if (-not $response.value) { throw "GitHub OIDC response did not contain a token" }
          $tokenFile = Join-Path $env:RUNNER_TEMP "webgpt-azure-federated-token.jwt"
          [IO.File]::WriteAllText($tokenFile, $response.value, [Text.UTF8Encoding]::new($false))
          "AZURE_FEDERATED_TOKEN_FILE=$tokenFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build Windows native helpers
        run: npm --prefix agent-runtime run build:native
      - name: Prepare Windows AppContainer host access
        shell: pwsh
        run: |
          $prep = (Resolve-Path "agent-runtime\native\windows-host-prep\bin\release\lpc-windows-host-prep.exe").Path
          & $prep --apply
          if ($LASTEXITCODE -ne 0) { throw "host-prep first apply failed with exit $LASTEXITCODE" }
          & $prep --apply
          if ($LASTEXITCODE -ne 0) { throw "host-prep second apply failed with exit $LASTEXITCODE" }
          $readyJson = & $prep --check --json
          if ($LASTEXITCODE -ne 0) { throw "host-prep check failed with exit $LASTEXITCODE" }
          if (($readyJson | ConvertFrom-Json).status -ne "ready") { throw "host-prep did not become ready: $readyJson" }
          & $prep --remove
          if ($LASTEXITCODE -ne 0) { throw "host-prep remove failed with exit $LASTEXITCODE" }
          $removedJson = & $prep --check --json
          if ($LASTEXITCODE -ne 0) { throw "host-prep post-remove check failed with exit $LASTEXITCODE" }
          if (($removedJson | ConvertFrom-Json).status -ne "capability_ace_missing") { throw "host-prep remained unexpectedly ready after remove: $removedJson" }
          & $prep --apply
          if ($LASTEXITCODE -ne 0) { throw "host-prep repair apply failed with exit $LASTEXITCODE" }
          $repairedJson = & $prep --check --json
          if ($LASTEXITCODE -ne 0) { throw "host-prep repair check failed with exit $LASTEXITCODE" }
          if (($repairedJson | ConvertFrom-Json).status -ne "ready") { throw "host-prep repair did not return to ready: $repairedJson" }
      - name: Run Windows acceptance as standard user
        shell: pwsh
        run: |
          $username = "wgbrel$PID"
          $passwordPlain = "WgB!$([guid]::NewGuid().ToString('N'))9a"
          $securePassword = ConvertTo-SecureString $passwordPlain -AsPlainText -Force
          New-LocalUser -Name $username -Password $securePassword -AccountNeverExpires -PasswordNeverExpires | Out-Null
          $qualified = "$env:COMPUTERNAME\$username"
          try {
            $adminMembers = Get-LocalGroupMember -Group "Administrators"
            if ($adminMembers.Name -contains $qualified) { throw "acceptance user unexpectedly belongs to Administrators" }
            & "$env:SystemRoot\System32\icacls.exe" $env:GITHUB_WORKSPACE /grant "${qualified}:(OI)(CI)M" /Q | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "failed to grant the standard user workspace access" }
            $npm = (Get-Command npm.cmd).Source
            $stdout = Join-Path $env:RUNNER_TEMP "webgpt-release-standard-user.stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "webgpt-release-standard-user.stderr.log"
            $credential = [System.Management.Automation.PSCredential]::new($qualified, $securePassword)
            $process = Start-Process -FilePath $npm `
              -ArgumentList @("--prefix", "agent-runtime", "run", "acceptance", "--", "--prebuilt-native") `
              -WorkingDirectory $env:GITHUB_WORKSPACE `
              -Credential $credential `
              -LoadUserProfile `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -Wait -PassThru
            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            if ($process.ExitCode -ne 0) { throw "standard-user Windows acceptance failed with exit $($process.ExitCode)" }
          }
          finally {
            Remove-LocalUser -Name $username -ErrorAction SilentlyContinue
          }
      - run: npm run dist:win
      - name: Smoke install Windows NSIS artifact
        shell: pwsh
        run: |
          $prep = (Resolve-Path "agent-runtime\native\windows-host-prep\bin\release\lpc-windows-host-prep.exe").Path
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File "scripts\windows-installer-smoke.ps1" `
            -ArtifactsDir "release" `
            -SourcePrep $prep
          if ($LASTEXITCODE -ne 0) { throw "Windows installer lifecycle smoke failed with exit $LASTEXITCODE" }
      - name: Verify required Authenticode signatures
        shell: pwsh
        run: |
          function Resolve-One([string]$Filter) {
            $matches = @(Get-ChildItem -Path "release" -Recurse -Filter $Filter -File)
            if ($matches.Count -ne 1) { throw "required signed release executable must resolve exactly once: $Filter (found $($matches.Count))" }
            return $matches[0].FullName
          }
          $required = @(
            (Resolve-One "WebGPT Bridge-*-win-x64.exe"),
            (Resolve-One "WebGPT Bridge.exe"),
            (Resolve-One "lpc-windows-sandbox.exe"),
            (Resolve-One "lpc-windows-host-prep.exe")
          )
          foreach ($file in $required) {
            $sig = Get-AuthenticodeSignature -FilePath $file
            if ($sig.Status -ne "Valid") { throw "invalid Authenticode signature: $file ($($sig.Status))" }
            if ($sig.SignerCertificate.Subject -ne $env:WEBGPT_WINDOWS_PUBLISHER) { throw "publisher mismatch: $file ($($sig.SignerCertificate.Subject))" }
            if (-not $sig.TimeStamperCertificate) { throw "timestamp missing: $file" }
          }
      - name: Gate signed Windows packaged updater E2E
        shell: pwsh
        run: |
          $feed = "http://127.0.0.1:18181/"
          $sentinel = Join-Path $env:RUNNER_TEMP "webgpt-update-e2e.json"
          $ready = Join-Path $env:RUNNER_TEMP "webgpt-update-e2e.ready.json"
          $oldConfig = Join-Path $env:RUNNER_TEMP "e2e-old.cjs"
          $newConfig = Join-Path $env:RUNNER_TEMP "e2e-new.cjs"
          Remove-Item -LiteralPath $sentinel,$ready -Force -ErrorAction SilentlyContinue

          node scripts/update-e2e-feed.cjs --url $feed --version 90.0.0 --expected-version 90.0.1 --sentinel $sentinel --out $oldConfig
          if ($LASTEXITCODE -ne 0) { throw "failed to generate old Windows updater E2E config" }
          node scripts/update-e2e-feed.cjs --url $feed --version 90.0.1 --expected-version 90.0.1 --sentinel $sentinel --out $newConfig
          if ($LASTEXITCODE -ne 0) { throw "failed to generate new Windows updater E2E config" }

          & ".\node_modules\.bin\electron-builder.cmd" --config $oldConfig --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "old signed Windows updater E2E build failed" }
          & ".\node_modules\.bin\electron-builder.cmd" --config $newConfig --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw "new signed Windows updater E2E build failed" }

          $oldDir = [IO.Path]::ChangeExtension($oldConfig, $null)
          $newDir = [IO.Path]::ChangeExtension($newConfig, $null)
          $oldInstaller = Get-ChildItem -Path $oldDir -Filter "WebGPT Bridge-90.0.0-win-x64.exe" -File | Select-Object -First 1
          $newInstaller = Get-ChildItem -Path $newDir -Filter "WebGPT Bridge-90.0.1-win-x64.exe" -File | Select-Object -First 1
          if (-not $oldInstaller -or -not $newInstaller) { throw "signed Windows updater E2E installer missing" }
          foreach ($file in @($oldInstaller.FullName, $newInstaller.FullName)) {
            $sig = Get-AuthenticodeSignature -FilePath $file
            if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -ne $env:WEBGPT_WINDOWS_PUBLISHER -or -not $sig.TimeStamperCertificate) {
              throw "Windows updater E2E installer signature gate failed: $file"
            }
          }

          $serverOut = Join-Path $env:RUNNER_TEMP "webgpt-update-e2e-server.stdout.log"
          $serverErr = Join-Path $env:RUNNER_TEMP "webgpt-update-e2e-server.stderr.log"
          $server = Start-Process -FilePath (Get-Command node).Source `
            -ArgumentList @("scripts/update-e2e-assert.cjs", "--root", $newDir, "--port", "18181", "--sentinel", $sentinel, "--expected-version", "90.0.1", "--timeout-ms", "240000", "--ready", $ready) `
            -WorkingDirectory $env:GITHUB_WORKSPACE `
            -RedirectStandardOutput $serverOut `
            -RedirectStandardError $serverErr `
            -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(20)
            while (-not (Test-Path $ready)) {
              if ($server.HasExited) { throw "Windows updater E2E server exited before becoming ready" }
              if ((Get-Date) -gt $deadline) { throw "Windows updater E2E server did not become ready" }
              Start-Sleep -Milliseconds 200
            }

            $install = Start-Process -FilePath $oldInstaller.FullName -ArgumentList @("/S") -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "old Windows updater E2E install failed with exit $($install.ExitCode)" }
            $installedExe = Join-Path $env:ProgramFiles "WebGPT Bridge\WebGPT Bridge.exe"
            if (-not (Test-Path $installedExe)) { throw "installed old Windows updater E2E app missing" }
            Start-Process -FilePath $installedExe | Out-Null

            $server.WaitForExit()
            if (Test-Path $serverOut) { Get-Content $serverOut | Write-Host }
            if (Test-Path $serverErr) { Get-Content $serverErr | Write-Host }
            if ($server.ExitCode -ne 0) { throw "Windows packaged updater E2E failed with exit $($server.ExitCode)" }

            $result = Get-Content -LiteralPath $sentinel -Raw | ConvertFrom-Json
            if ($result.version -ne "90.0.1" -or $result.phase -ne "updated") { throw "Windows updater E2E sentinel mismatch" }
            $installedPrep = Join-Path $env:ProgramFiles "WebGPT Bridge\resources\app.asar.unpacked\agent-runtime\native\windows-host-prep\bin\release\lpc-windows-host-prep.exe"
            $readyJson = & $installedPrep --check --json
            if ($LASTEXITCODE -ne 0 -or ($readyJson | ConvertFrom-Json).status -ne "ready") { throw "Windows host preparation not ready after updater E2E: $readyJson" }
            $task = Get-ScheduledTask -TaskName "WebGPT Bridge Host Preparation" -ErrorAction Stop
            if ($task.Principal.UserId -notin @("SYSTEM", "NT AUTHORITY\SYSTEM", "S-1-5-18") -or $task.Principal.RunLevel.ToString() -ne "Highest") { throw "Windows updater E2E task principal changed" }
            $actions = @($task.Actions)
            if ($actions.Count -ne 1 -or ($actions[0].Arguments ?? "").Trim() -ne "--apply") { throw "Windows updater E2E task action changed" }
            $taskExe = [IO.Path]::GetFullPath($actions[0].Execute.Trim('"'))
            if (-not [string]::Equals($taskExe, [IO.Path]::GetFullPath($installedPrep), [StringComparison]::OrdinalIgnoreCase)) { throw "Windows updater E2E task executable changed" }
          }
          finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-windows
          path: release/*
      - name: Cleanup Windows release credentials and host preparation
        if: always()
        shell: pwsh
        run: |
          if ($env:AZURE_FEDERATED_TOKEN_FILE) {
            Remove-Item -LiteralPath $env:AZURE_FEDERATED_TOKEN_FILE -Force -ErrorAction SilentlyContinue
          }
          $installRoot = Join-Path $env:ProgramFiles "WebGPT Bridge"
          if (Test-Path $installRoot) {
            $uninstaller = Get-ChildItem -Path $installRoot -Filter "Uninstall*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($uninstaller) {
              $cleanup = Start-Process -FilePath $uninstaller.FullName -ArgumentList @("/S") -Wait -PassThru
              if ($cleanup.ExitCode -ne 0) { Write-Warning "release cleanup uninstall returned exit $($cleanup.ExitCode)" }
            }
          }
          & "$env:SystemRoot\System32\schtasks.exe" /Delete /TN "WebGPT Bridge Host Preparation" /F *> $null
          $prep = "agent-runtime\native\windows-host-prep\bin\release\lpc-windows-host-prep.exe"
          if (Test-Path $prep) {
            & $prep --remove
            if ($LASTEXITCODE -ne 0) { Write-Warning "host-prep cleanup returned exit $LASTEXITCODE" }
          }

  macos:
    needs: [verify, draft]
    runs-on: macos-latest
    environment: desktop-release-macos
    permissions:
      contents: read
    env:
      WEBGPT_FORMAL_RELEASE: "macos"
      WEBGPT_MAC_IDENTITY: ${{ vars.WEBGPT_MAC_IDENTITY }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare ephemeral App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in WEBGPT_MAC_IDENTITY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name:-}" ]; then
              echo "missing protected macOS release configuration: $name" >&2
              exit 1
            fi
          done
          if [ -z "${APPLE_API_KEY_BASE64:-}" ]; then
            echo "missing protected macOS release secret: APPLE_API_KEY_BASE64" >&2
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          export KEY_PATH
          node -e 'const fs=require("node:fs"); const raw=process.env.APPLE_API_KEY_BASE64||""; const bytes=Buffer.from(raw,"base64"); const text=bytes.toString("utf8"); if(!bytes.length || !text.includes("BEGIN PRIVATE KEY")) throw new Error("decoded Apple API key is not a private key"); fs.writeFileSync(process.env.KEY_PATH, bytes, {mode:0o600});'
          chmod 600 "$KEY_PATH"
          printf 'APPLE_API_KEY=%s\n' "$KEY_PATH" >> "$GITHUB_ENV"
      - name: Build signed notarized Universal macOS artifacts
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ] || [ -z "${CSC_KEY_PASSWORD:-}" ]; then
            echo "missing protected Developer ID signing secret" >&2
            exit 1
          fi
          npm run dist:mac
      - name: Verify Universal slices signing notarization and Gatekeeper
        shell: bash
        run: |
          set -euo pipefail
          APP_COUNT="$(find release -type d -name 'WebGPT Bridge.app' -print | wc -l | tr -d '[:space:]')"
          if [ "$APP_COUNT" != "1" ]; then
            echo "packaged app must resolve exactly once; found $APP_COUNT" >&2
            exit 1
          fi
          APP="$(find release -type d -name 'WebGPT Bridge.app' -print -quit)"
          APP_BIN="$APP/Contents/MacOS/WebGPT Bridge"
          TUNNEL_BIN="$APP/Contents/Resources/tunnel-client/tunnel-client"
          CLOUDFLARED_BIN="$APP/Contents/Resources/tunnel-client/cloudflared"

          check_arches() {
            local file="$1"
            [ -f "$file" ] || { echo "required Universal binary missing: $file" >&2; exit 1; }
            local arches
            arches="$(/usr/bin/lipo -archs "$file")"
            printf '%s\n' "$arches" | grep -qw arm64
            printf '%s\n' "$arches" | grep -qw x86_64
          }
          check_arches "$APP_BIN"
          check_arches "$TUNNEL_BIN"
          check_arches "$CLOUDFLARED_BIN"

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$TUNNEL_BIN"
          codesign --verify --strict --verbose=2 "$CLOUDFLARED_BIN"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -F "Authority=$WEBGPT_MAC_IDENTITY"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

          DMG_COUNT="$(find release -maxdepth 1 -type f -name 'WebGPT Bridge-*-mac-universal.dmg' -print | wc -l | tr -d '[:space:]')"
          ZIP_COUNT="$(find release -maxdepth 1 -type f -name 'WebGPT Bridge-*-mac-universal.zip' -print | wc -l | tr -d '[:space:]')"
          if [ "$DMG_COUNT" != "1" ] || [ "$ZIP_COUNT" != "1" ]; then
            echo "formal macOS release must contain exactly one Universal DMG and ZIP" >&2
            exit 1
          fi
      - name: Gate signed macOS packaged updater E2E
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          FEED="http://127.0.0.1:18181/"
          SENTINEL="$RUNNER_TEMP/webgpt-update-e2e.json"
          READY="$RUNNER_TEMP/webgpt-update-e2e.ready.json"
          OLD_CONFIG="$RUNNER_TEMP/e2e-old.cjs"
          NEW_CONFIG="$RUNNER_TEMP/e2e-new.cjs"
          rm -f -- "$SENTINEL" "$READY"

          node scripts/update-e2e-feed.cjs --url "$FEED" --version 90.0.0 --expected-version 90.0.1 --sentinel "$SENTINEL" --out "$OLD_CONFIG"
          node scripts/update-e2e-feed.cjs --url "$FEED" --version 90.0.1 --expected-version 90.0.1 --sentinel "$SENTINEL" --out "$NEW_CONFIG"
          ./node_modules/.bin/electron-builder --config "$OLD_CONFIG" --mac zip --universal --publish never
          ./node_modules/.bin/electron-builder --config "$NEW_CONFIG" --mac zip --universal --publish never

          OLD_DIR="${OLD_CONFIG%.cjs}"
          NEW_DIR="${NEW_CONFIG%.cjs}"
          OLD_APP_COUNT="$(find "$OLD_DIR" -type d -name 'WebGPT Bridge.app' -print | wc -l | tr -d '[:space:]')"
          NEW_APP_COUNT="$(find "$NEW_DIR" -type d -name 'WebGPT Bridge.app' -print | wc -l | tr -d '[:space:]')"
          if [ "$OLD_APP_COUNT" != "1" ] || [ "$NEW_APP_COUNT" != "1" ]; then
            echo "macOS updater E2E apps must resolve exactly once" >&2
            exit 1
          fi
          OLD_APP="$(find "$OLD_DIR" -type d -name 'WebGPT Bridge.app' -print -quit)"
          NEW_APP="$(find "$NEW_DIR" -type d -name 'WebGPT Bridge.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$OLD_APP"
          codesign --verify --deep --strict --verbose=2 "$NEW_APP"
          xcrun stapler validate "$OLD_APP"
          xcrun stapler validate "$NEW_APP"

          SERVER_OUT="$RUNNER_TEMP/webgpt-update-e2e-server.stdout.log"
          SERVER_ERR="$RUNNER_TEMP/webgpt-update-e2e-server.stderr.log"
          node scripts/update-e2e-assert.cjs --root "$NEW_DIR" --port 18181 --sentinel "$SENTINEL" --expected-version 90.0.1 --timeout-ms 240000 --ready "$READY" >"$SERVER_OUT" 2>"$SERVER_ERR" &
          SERVER_PID=$!
          cleanup_e2e() {
            if kill -0 "$SERVER_PID" 2>/dev/null; then kill "$SERVER_PID" 2>/dev/null || true; fi
          }
          trap cleanup_e2e EXIT
          for _ in $(seq 1 100); do
            [ -f "$READY" ] && break
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$SERVER_OUT" || true
              cat "$SERVER_ERR" >&2 || true
              exit 1
            fi
            sleep 0.2
          done
          [ -f "$READY" ] || { echo "macOS updater E2E server did not become ready" >&2; exit 1; }

          TEST_ROOT="$RUNNER_TEMP/webgpt-update-e2e-app"
          TEST_APP="$TEST_ROOT/WebGPT Bridge.app"
          rm -rf -- "$TEST_ROOT"
          mkdir -p "$TEST_ROOT"
          /usr/bin/ditto "$OLD_APP" "$TEST_APP"
          open -n -W "$TEST_APP" >/dev/null 2>&1 &
          OPEN_PID=$!

          set +e
          wait "$SERVER_PID"
          SERVER_STATUS=$?
          set -e
          cat "$SERVER_OUT" || true
          cat "$SERVER_ERR" >&2 || true
          if [ "$SERVER_STATUS" -ne 0 ]; then exit "$SERVER_STATUS"; fi
          wait "$OPEN_PID" || true
          trap - EXIT

          node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(value.version!=="90.0.1"||value.phase!=="updated") process.exit(1)' "$SENTINEL"
          codesign --verify --deep --strict --verbose=2 "$TEST_APP"
          xcrun stapler validate "$TEST_APP"
          /usr/bin/lipo -archs "$TEST_APP/Contents/MacOS/WebGPT Bridge" | grep -qw arm64
          /usr/bin/lipo -archs "$TEST_APP/Contents/MacOS/WebGPT Bridge" | grep -qw x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-macos
          path: release/*
      - name: Cleanup macOS notarization credential
        if: always()
        shell: bash
        run: |
          set -u
          if [ -n "${APPLE_API_KEY:-}" ] && [[ "$APPLE_API_KEY" == "$RUNNER_TEMP/"* ]]; then
            rm -f -- "$APPLE_API_KEY"
          fi

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-windows
          path: release-win
      - uses: actions/download-artifact@v4
        with:
          name: desktop-release-macos
          path: release-mac
      - run: node scripts/validate-release-assets.cjs --version "${GITHUB_REF_NAME#v}" --windows release-win --mac release-mac
      - run: node scripts/write-release-checksums.cjs release-win release-mac --out SHA256SUMS
      - name: Upload exact validated assets to draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -d '' ASSETS < <(find release-win release-mac -maxdepth 1 -type f -print0)
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "no validated release assets found" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${ASSETS[@]}" SHA256SUMS
      - name: Publish stable release atomically after all gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
