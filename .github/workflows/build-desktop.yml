name: Build desktop apps

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

jobs:
  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: webgpt-bridge-macos-universal
          path: release/*

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - run: npm --prefix agent-runtime ci
      - name: Build Windows native helpers
        run: npm --prefix agent-runtime run build:native
      - name: Prepare Windows AppContainer host access
        shell: pwsh
        run: |
          $prep = (Resolve-Path "agent-runtime\native\windows-host-prep\bin\release\lpc-windows-host-prep.exe").Path
          & $prep --apply
          if ($LASTEXITCODE -ne 0) { throw "host-prep first apply failed with exit $LASTEXITCODE" }
          & $prep --apply
          if ($LASTEXITCODE -ne 0) { throw "host-prep second apply failed with exit $LASTEXITCODE" }
          $checkJson = & $prep --check --json
          if ($LASTEXITCODE -ne 0) { throw "host-prep check failed with exit $LASTEXITCODE" }
          $check = $checkJson | ConvertFrom-Json
          if ($check.status -ne "ready") { throw "host-prep did not become ready: $checkJson" }

          & $prep --remove
          if ($LASTEXITCODE -ne 0) { throw "host-prep remove failed with exit $LASTEXITCODE" }
          $removedJson = & $prep --check --json
          if ($LASTEXITCODE -ne 0) { throw "host-prep post-remove check failed with exit $LASTEXITCODE" }
          $removed = $removedJson | ConvertFrom-Json
          if ($removed.status -ne "capability_ace_missing") { throw "host-prep remained unexpectedly ready after remove: $removedJson" }

          & $prep --apply
          if ($LASTEXITCODE -ne 0) { throw "host-prep repair apply failed with exit $LASTEXITCODE" }
          $repairedJson = & $prep --check --json
          if ($LASTEXITCODE -ne 0) { throw "host-prep repair check failed with exit $LASTEXITCODE" }
          $repaired = $repairedJson | ConvertFrom-Json
          if ($repaired.status -ne "ready") { throw "host-prep repair did not return to ready: $repairedJson" }
      - name: Run Windows acceptance as standard user
        shell: pwsh
        run: |
          $username = "wgbci$PID"
          $passwordPlain = "WgB!$([guid]::NewGuid().ToString('N'))9a"
          $securePassword = ConvertTo-SecureString $passwordPlain -AsPlainText -Force
          New-LocalUser -Name $username -Password $securePassword -AccountNeverExpires -PasswordNeverExpires | Out-Null
          $qualified = "$env:COMPUTERNAME\$username"
          try {
            $adminMembers = Get-LocalGroupMember -Group "Administrators"
            if ($adminMembers.Name -contains $qualified) { throw "acceptance user unexpectedly belongs to Administrators" }
            & "$env:SystemRoot\System32\icacls.exe" $env:GITHUB_WORKSPACE /grant "${qualified}:(OI)(CI)M" /Q | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "failed to grant the standard user workspace access" }

            $npm = (Get-Command npm.cmd).Source
            $acceptanceCommand = "npm --prefix agent-runtime run acceptance"
            Write-Host "Running as $qualified: $acceptanceCommand"
            $stdout = Join-Path $env:RUNNER_TEMP "webgpt-standard-user-acceptance.stdout.log"
            $stderr = Join-Path $env:RUNNER_TEMP "webgpt-standard-user-acceptance.stderr.log"
            $credential = [System.Management.Automation.PSCredential]::new($qualified, $securePassword)
            $process = Start-Process -FilePath $npm `
              -ArgumentList @("--prefix", "agent-runtime", "run", "acceptance") `
              -WorkingDirectory $env:GITHUB_WORKSPACE `
              -Credential $credential `
              -LoadUserProfile `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -Wait -PassThru
            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            if ($process.ExitCode -ne 0) { throw "standard-user Windows acceptance failed with exit $($process.ExitCode)" }
          }
          finally {
            Remove-LocalUser -Name $username -ErrorAction SilentlyContinue
          }
      - run: npm run dist:win
      - name: Smoke install Windows NSIS artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "release" -Filter "WebGPT Bridge-*-win-x64.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "built Windows NSIS installer was not found" }

          $sourcePrep = (Resolve-Path "agent-runtime\native\windows-host-prep\bin\release\lpc-windows-host-prep.exe").Path
          $installRoot = Join-Path $env:ProgramFiles "WebGPT Bridge"
          if (Test-Path $installRoot) { throw "pre-existing WebGPT Bridge Program Files installation would invalidate installer smoke" }
          $preexistingTask = Get-ScheduledTask -TaskName "WebGPT Bridge Host Preparation" -ErrorAction SilentlyContinue
          if ($preexistingTask) { throw "pre-existing SYSTEM host-preparation task would invalidate installer smoke" }

          & $sourcePrep --remove
          if ($LASTEXITCODE -ne 0) { throw "pre-install host-prep remove failed with exit $LASTEXITCODE" }
          $preInstallJson = & $sourcePrep --check --json
          if ($LASTEXITCODE -ne 0) { throw "pre-install host-prep check failed with exit $LASTEXITCODE" }
          $preInstall = $preInstallJson | ConvertFrom-Json
          if ($preInstall.status -ne "capability_ace_missing") { throw "pre-install host preparation must be capability_ace_missing: $preInstallJson" }

          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "silent NSIS installation failed with exit $($install.ExitCode)" }

          $installedPrep = Join-Path $installRoot "resources\app.asar.unpacked\agent-runtime\native\windows-host-prep\bin\release\lpc-windows-host-prep.exe"
          if (-not (Test-Path $installedPrep)) { throw "installed host-prep helper was not found under Program Files" }

          $task = Get-ScheduledTask -TaskName "WebGPT Bridge Host Preparation" -ErrorAction SilentlyContinue
          if (-not $task) { throw "installed SYSTEM host-preparation task was not registered" }
          if ($task.Principal.UserId -notin @("SYSTEM", "NT AUTHORITY\SYSTEM", "S-1-5-18")) { throw "host-preparation task principal is not SYSTEM: $($task.Principal.UserId)" }
          if ($task.Principal.RunLevel.ToString() -ne "Highest") { throw "host-preparation task is not configured for highest privileges: $($task.Principal.RunLevel)" }
          $taskActions = @($task.Actions)
          if ($taskActions.Count -ne 1) { throw "host-preparation task must have exactly one action" }
          $taskExecute = [IO.Path]::GetFullPath($taskActions[0].Execute.Trim('"'))
          $expectedExecute = [IO.Path]::GetFullPath($installedPrep)
          if (-not [string]::Equals($taskExecute, $expectedExecute, [StringComparison]::OrdinalIgnoreCase)) { throw "host-preparation task executable is not the protected installed helper: $taskExecute" }
          if (($taskActions[0].Arguments ?? "").Trim() -ne "--apply") { throw "host-preparation task Arguments must be fixed to --apply: $($taskActions[0].Arguments)" }
          $taskTriggers = @($task.Triggers)
          if ($taskTriggers.Count -ne 1 -or $taskTriggers[0].CimClass.CimClassName -ne "MSFT_TaskBootTrigger") { throw "host-preparation task must have exactly one boot trigger" }

          $installedJson = & $installedPrep --check --json
          if ($LASTEXITCODE -ne 0) { throw "installed host-prep check failed with exit $LASTEXITCODE" }
          $installed = $installedJson | ConvertFrom-Json
          if ($installed.status -ne "ready") { throw "installed host preparation is not ready: $installedJson" }

          $uninstaller = Get-ChildItem -Path $installRoot -Filter "Uninstall*.exe" -File | Select-Object -First 1
          if (-not $uninstaller) { throw "installed NSIS uninstaller was not found" }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @("/S") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "silent NSIS uninstall failed with exit $($uninstall.ExitCode)" }
          $remainingTask = Get-ScheduledTask -TaskName "WebGPT Bridge Host Preparation" -ErrorAction SilentlyContinue
          if ($remainingTask) { throw "SYSTEM host-preparation task remained after uninstall" }
          if (Test-Path $installedPrep) { throw "installed host-prep payload remained after uninstall" }

          $removedJson = & $sourcePrep --check --json
          if ($LASTEXITCODE -ne 0) { throw "post-uninstall host-prep check failed with exit $LASTEXITCODE" }
          $removed = $removedJson | ConvertFrom-Json
          if ($removed.status -ne "capability_ace_missing") { throw "uninstall did not remove the product capability ACE: $removedJson" }
      - uses: actions/upload-artifact@v4
        with:
          name: webgpt-bridge-windows-x64
          path: release/*
      - name: Cleanup Windows host preparation
        if: always()
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:ProgramFiles "WebGPT Bridge"
          if (Test-Path $installRoot) {
            $uninstaller = Get-ChildItem -Path $installRoot -Filter "Uninstall*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($uninstaller) {
              $cleanupUninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @("/S") -Wait -PassThru
              if ($cleanupUninstall.ExitCode -ne 0) { Write-Warning "installer-smoke cleanup uninstall returned exit $($cleanupUninstall.ExitCode)" }
            }
          }
          & "$env:SystemRoot\System32\schtasks.exe" /Delete /TN "WebGPT Bridge Host Preparation" /F *> $null
          $prep = "agent-runtime\native\windows-host-prep\bin\release\lpc-windows-host-prep.exe"
          if (Test-Path $prep) {
            & $prep --remove
            if ($LASTEXITCODE -ne 0) { Write-Warning "host-prep cleanup returned exit $LASTEXITCODE" }
          }
