name: Replace v0.3.7 prerelease

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    if: github.event.head_commit.message == 'dispatch v0.3.7 replacement release retry'
    runs-on: ubuntu-latest
    steps:
      - name: Verify replacement tag and dispatch formal release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_SHA: 5a55a4a832269db2c3a6bf6caf3ecf9d76d4e1aa
        run: |
          set -euo pipefail

          if gh release view v0.3.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "refusing to dispatch: a v0.3.7 release already exists" >&2
            exit 1
          fi

          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.3.7" --jq '.object.sha')"
          if [ "$tag_sha" != "$EXPECTED_TAG_SHA" ]; then
            echo "v0.3.7 tag moved unexpectedly: $tag_sha" >&2
            exit 1
          fi

          gh workflow run release-desktop.yml --repo "$GITHUB_REPOSITORY" --ref v0.3.7
